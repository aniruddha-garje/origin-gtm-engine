name: gtm-engine
run-name: "${{ github.event_name == 'push' && 'publish site' || 'daily engine run' }}"

# Runs the pipeline every day, saves the result to the repo, and republishes the site on GitHub Pages.
# Needs no secrets. BLS_API_KEY is optional and only raises the wage API's daily limit.
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC, 09:47 IST, before the US working day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the engine
        if: github.event_name != 'push'
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: node pipeline/run.mjs

      - name: Save the run
        if: github.event_name != 'push'
        run: |
          git config user.name "gtm-engine"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data/live.json
          git diff --cached --quiet || git commit -m "engine run $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
